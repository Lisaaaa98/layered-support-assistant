[project]
name = "layered-support-assistant"
version = "0.1.0"
description = "On-device, layered customer-support assistant for DBS credit cards"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "gradio>=6.27.0",
    "lxml>=6.1.3",
    "mlx-lm>=0.31.3",
    "pdfplumber>=0.11.10",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.0.1",
]

# An application, not a library: nothing here is meant to be imported from
# outside, so there is no package to build.
[tool.uv]
package = false
